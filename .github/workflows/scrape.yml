name: Manual Multi-Site Scraper Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-scraper-check
  cancel-in-progress: true

jobs:
  scrape-jobs:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --ignore-scripts

      - name: Audit scraper dependencies (advisory)
        working-directory: scraper
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo '::warning title=Dependency audit::High or critical npm advisories affect the scraper. Run npm audit fix in scraper/.'
          fi

      - name: Run scraper into an isolated artifact directory
        working-directory: scraper
        run: |
          mkdir -p ../jobsaf_node/pages
          node scrape_all.js \
            --max-pages 50 \
            --source-timeout-minutes 15 \
            --json ../jobsaf_node/pages/jobs.json \
            --csv ../jobsaf_node/pages/jobs.csv \
            --debug-dir debug

      - name: Validate scraper output
        run: |
          node scripts/validate-data.mjs \
            jobsaf_node/pages/jobs.json \
            --min-jobs 1 \
            --min-sources 1 \
            --max-expired 0 \
            --require-relevance

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scraper-check-${{ github.run_id }}
          path: |
            jobsaf_node/pages/
            scraper/debug/
          if-no-files-found: ignore
          retention-days: 7
