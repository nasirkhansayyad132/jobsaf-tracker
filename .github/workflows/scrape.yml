name: Manual Multi-Site Scraper Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manual-scraper-check
  cancel-in-progress: true

jobs:
  scrape-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --ignore-scripts

      - name: Audit scraper dependencies
        working-directory: scraper
        run: npm audit --audit-level=high

      - name: Run scraper into an isolated artifact directory
        working-directory: scraper
        run: |
          mkdir -p ../jobsaf_node/pages
          node scrape_all.js \
            --max-pages 10 \
            --json ../jobsaf_node/pages/jobs.json \
            --csv ../jobsaf_node/pages/jobs.csv \
            --debug-dir debug

      - name: Validate scraper output
        run: |
          node scripts/validate-data.mjs \
            jobsaf_node/pages/jobs.json \
            --min-jobs 1 \
            --min-sources 1 \
            --max-expired 0 \
            --require-relevance

      - name: Upload results and diagnostics
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: scraper-check-${{ github.run_id }}
          path: |
            jobsaf_node/pages/
            scraper/debug/
          if-no-files-found: ignore
          retention-days: 7
