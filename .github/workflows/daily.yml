name: Daily Afghanistan Tech Jobs

on:
  schedule:
    # GitHub cron is UTC: 04:30 UTC is 09:00 Asia/Kabul.
    - cron: '30 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobs-data-publish
  cancel-in-progress: false

jobs:
  scrape:
    name: Scrape and validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Checkout repository without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --ignore-scripts

      # New advisories are published continuously. One must never stop the
      # daily data refresh: report it here, enforce it in CI, and let
      # Dependabot open the lockfile fix.
      - name: Audit scraper dependencies (advisory)
        working-directory: scraper
        run: |
          if ! npm audit --omit=dev --audit-level=high; then
            echo '::warning title=Dependency audit::High or critical npm advisories affect the scraper. The scrape continues; merge the Dependabot update or run npm audit fix in scraper/.'
          fi

      - name: Preserve previous data as the safety baseline
        run: |
          mkdir -p data docs/data scraper/debug
          if [ -f docs/data/jobs.json ]; then
            cp docs/data/jobs.json data/last_jobs.json
          else
            echo '[]' > data/last_jobs.json
          fi

      - name: Run all source scrapers
        working-directory: scraper
        env:
          # Optional: a free ReliefWeb API appname enables the ReliefWeb source.
          RELIEFWEB_APPNAME: ${{ vars.RELIEFWEB_APPNAME || secrets.RELIEFWEB_APPNAME }}
        run: |
          node scrape_all.js \
            --json ../docs/data/jobs.json \
            --csv ../data/jobs.csv \
            --max-pages 50 \
            --source-timeout-minutes 15 \
            --debug-dir debug

      - name: Generate compact public summary
        working-directory: scraper
        run: node generate_summary.js ../docs/data/jobs.json ../docs/data/summary.json ../data/last_jobs.json debug/source-health.json

      - name: Validate schema, relevance, freshness, and data-loss limits
        run: |
          node scripts/validate-data.mjs \
            docs/data/jobs.json \
            docs/data/summary.json \
            --baseline data/last_jobs.json \
            --max-drop-percent 35 \
            --min-jobs 10 \
            --min-sources 3 \
            --max-expired 0 \
            --require-relevance

      - name: Stage validated publication files
        run: |
          mkdir -p publish/docs/data publish/data
          cp docs/data/jobs.json publish/docs/data/jobs.json
          cp docs/data/summary.json publish/docs/data/summary.json
          cp data/jobs.csv publish/data/jobs.csv

      - name: Upload validated publication data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: validated-job-data-${{ github.run_id }}
          path: publish/
          if-no-files-found: error
          retention-days: 7

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scraper-diagnostics-${{ github.run_id }}
          path: |
            scraper/debug/
            docs/data/summary.json
            data/jobs.csv
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish validated data
    needs: scrape
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout the exact scrape revision with write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download validated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-job-data-${{ github.run_id }}
          path: generated

      - name: Revalidate downloaded artifact
        run: |
          node scripts/validate-data.mjs \
            generated/docs/data/jobs.json \
            generated/docs/data/summary.json \
            --min-jobs 10 \
            --min-sources 3 \
            --max-expired 0 \
            --require-relevance

      - name: Commit and push data update
        run: |
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            # Code pushed during the scrape must not cost a day of data. The
            # artifact can still be applied when nothing newer touched the
            # published data; a newer data commit always wins.
            if git diff --quiet "$GITHUB_SHA" origin/main -- docs/data/jobs.json docs/data/summary.json data/jobs.csv; then
              echo '::notice::main advanced during the scrape without data changes; publishing onto the newer main.'
              git checkout --quiet --detach origin/main
            else
              echo '::error::Newer job data reached main after this scrape started; refusing to replace it with an older artifact.'
              exit 1
            fi
          fi

          mkdir -p docs/data data
          cp generated/docs/data/jobs.json docs/data/jobs.json
          cp generated/docs/data/summary.json docs/data/summary.json
          cp generated/data/jobs.csv data/jobs.csv

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/data/jobs.json docs/data/summary.json data/jobs.csv

          if git diff --staged --quiet; then
            echo 'No data changes to publish.'
            exit 0
          fi

          git diff --staged --check
          git commit -m "Update jobs data: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push origin HEAD:main

  deploy-site:
    name: Deploy validated site
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      data_artifact: validated-job-data-${{ github.run_id }}
      # Build the newest site code, so a frontend change merged during the
      # scrape is not rolled back by this deployment.
      ref: main

  notify:
    name: Send digest
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    # The digest is optional. A mail problem is reported on its own (see
    # report-health) instead of marking the data refresh as failed.
    outputs:
      email_status: ${{ steps.send.outcome || 'skipped' }}

    steps:
      - name: Checkout notification script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download validated data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: validated-job-data-${{ github.run_id }}
          path: generated

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Check notification configuration
        id: notification
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          if [ -n "$SMTP_USER" ] && [ -n "$SMTP_PASS" ] && [ -n "$EMAIL_TO" ]; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
            echo '::warning::Email notification skipped because SMTP_USER, SMTP_PASS, or EMAIL_TO is not configured.'
          fi

      - name: Send email notification
        id: send
        if: steps.notification.outputs.enabled == 'true'
        continue-on-error: true
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python scripts/notify_email.py generated/docs/data/summary.json generated/docs/data/jobs.json

      - name: Flag an unsent digest
        if: steps.send.outcome == 'failure'
        run: echo '::warning title=Email digest not sent::The jobs data and website were updated, but the email could not be sent. See the "Daily email digest is failing" issue.'

  report-health:
    name: Report run health
    needs: [scrape, publish, deploy-site, notify]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      issues: write

    steps:
      # A silent failure once froze the public data for two weeks. Keep one
      # open issue per problem while it lasts (GitHub notifies the owner) and
      # close it automatically on the next healthy run. Data/site failures and
      # email failures are tracked separately: a broken mailbox must not make
      # a working tracker look stopped.
      - name: Open, update, or close the failure issues
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTS: ${{ toJSON(needs) }}
          EMAIL_STATUS: ${{ needs.notify.outputs.email_status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          find_issue() {
            gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$1\" in:title" --json number,title \
              --jq "map(select(.title == \"$1\")) | .[0].number // empty"
          }

          # report <title> <failure summary or empty> <body for a new issue>
          report() {
            local title="$1" failed="$2" body="$3" issue
            issue=$(find_issue "$title")
            if [ -n "$failed" ]; then
              if [ -n "$issue" ]; then
                gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" --body "Still failing ($failed): $RUN_URL"
              else
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
              fi
            elif [ -n "$issue" ]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment "Recovered: $RUN_URL"
            fi
          }

          failed=$(echo "$RESULTS" | jq -r 'to_entries[] | select(.key != "notify" and .value.result == "failure") | .key' | paste -sd ', ' -)
          report 'Daily job refresh is failing' "${failed:+**$failed**}" "The daily run failed in: **$failed**.

          Run: $RUN_URL

          Until this is fixed the website keeps showing the last good data. This issue closes itself after the next successful run."

          email_failed=''
          if [ "$EMAIL_STATUS" = 'failure' ] || [ "$(echo "$RESULTS" | jq -r '.notify.result')" = 'failure' ]; then
            email_failed='**email digest**'
          fi
          report 'Daily email digest is failing' "$email_failed" "The jobs data and website are still updated every day, but the email digest could not be sent.

          Run: $RUN_URL

          Most often the SMTP password stopped working. For Gmail: turn on 2-Step Verification, create a new App Password at https://myaccount.google.com/apppasswords, and save it as the \`SMTP_PASS\` repository secret (Settings → Secrets and variables → Actions). This issue closes itself after the next email is sent."
