name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'scripts/build-pages.mjs'
      - 'scripts/validate-data.mjs'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
    inputs:
      data_artifact:
        description: Optional validated data artifact from the calling workflow
        required: false
        type: string
        default: ''
      ref:
        description: Optional Git ref to build; defaults to the triggering commit
        required: false
        type: string
        default: ''

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build validated site artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      - name: Download validated data from caller
        if: inputs.data_artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.data_artifact }}
          path: generated

      - name: Use caller's validated canonical data
        if: inputs.data_artifact
        run: |
          cp generated/docs/data/jobs.json docs/data/jobs.json
          cp generated/docs/data/summary.json docs/data/summary.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      # Advisory only: an audit finding must not stop fresh data from being
      # deployed. CI enforces the audit on every pull request.
      - name: Audit frontend dependencies (advisory)
        working-directory: frontend
        run: |
          if ! npm audit --audit-level=high; then
            echo '::warning title=Dependency audit::High or critical npm advisories affect the frontend toolchain. Deployment continues; merge the Dependabot update or run npm audit fix in frontend/.'
          fi

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build site with canonical validated data
        working-directory: frontend
        run: npm run build:pages

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
