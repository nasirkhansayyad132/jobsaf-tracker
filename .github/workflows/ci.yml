name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scraper:
    name: Scraper tests and data validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: scraper/package-lock.json

      - name: Install scraper dependencies
        working-directory: scraper
        run: npm ci --ignore-scripts

      - name: Run scraper unit tests
        working-directory: scraper
        run: npm test

      - name: Run validator unit tests
        run: node --test scripts/tests/*.test.mjs

      # Judge committed data against the day it was generated. Otherwise every
      # pull request opened a few days after the last refresh would fail on
      # deadlines that passed since then, which the site already hides.
      - name: Validate committed public data
        run: |
          generated_on=$(node -p "require('./docs/data/summary.json').today")
          node scripts/validate-data.mjs docs/data/jobs.json docs/data/summary.json \
            --today "$generated_on" --min-jobs 10 --min-sources 3 --max-expired 0 --require-relevance

      - name: Audit scraper dependencies
        working-directory: scraper
        run: npm audit --audit-level=high

  frontend:
    name: Frontend lint and production artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Lint frontend
        working-directory: frontend
        run: npm run lint

      - name: Run frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Build validated Pages artifact
        working-directory: frontend
        run: npm run build:pages

      - name: Audit all frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

  python:
    name: Python syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Compile Python utilities
        run: python -m py_compile scripts/*.py
