# Keeps lockfiles ahead of newly published advisories, so a fix arrives as a
# reviewed pull request instead of as a failing scheduled run.
version: 2
updates:
  - package-ecosystem: npm
    directory: /scraper
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kabul
    open-pull-requests-limit: 5
    ignore:
      # p-limit 4+ is ESM-only; the CommonJS scraper's require("p-limit")
      # then gets a module object instead of the limiter function.
      - dependency-name: p-limit
        update-types: [version-update:semver-major]
    groups:
      scraper-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Kabul
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ['*']
